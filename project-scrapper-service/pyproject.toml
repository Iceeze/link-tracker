[tool.poetry]
name = "backend-academy-2026-python-template"
version = "0.1.0"
description = ""
package-mode = false
authors = ["g.tarasov <g.tarasov@tbank.ru>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
structlog = "^25.5.0"
fastapi = "^0.135.0"
uvicorn = "^0.41.0"
pydantic-settings = "^2.13.1"
httpx = "^0.28.1"
apscheduler = "^3.11.2"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.25"}
asyncpg = "^0.29.0"
alembic = "*"
psycopg2-binary = "^2.9.11"
aiokafka = "^0.13.0"
redis = "^7.4.0"
confluent-kafka = {extras = ["schema-registry"], version = "^2.14.0"}
fastavro = "^1.12.2"
tenacity = "^9.1.4"
slowapi = "^0.1.9"


[tool.poetry.group.dev.dependencies]
black = "^24.8.0"
isort = "^5.13.2"
ruff = "^0.6.1"
pytest = "*"
pytest-cov = "*"
pytest-deadfixtures = "*"
pytest-mock = "*"
pytest-repeat = "*"
pytest-asyncio = "*"
mypy = "^1.19.1"
pytest-httpx = "^0.36.0"
testcontainers = {extras = ["postgresql", "kafka"], version = "^4.3.0"}
psycopg2-binary = "^2.9.11"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.mypy]
plugins = ['pydantic.mypy', "sqlalchemy.ext.mypy.plugin"]
allow_redefinition = true
ignore_missing_imports = true
no_implicit_optional = true
strict_equality = true
warn_unused_ignores = true
exclude = "^(.*/)?test_[\\w]*\\.py$|conftest\\.py|tests"

[tool.pytest.ini_options]
asyncio_mode = "auto"
